<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Topographic Contour & Terrain Lines -->
  <path d="M 30,100 Q 60,60 100,60 T 170,100" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>
  <path d="M 40,115 Q 70,80 100,80 T 160,115" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" opacity="0.4"/>
  <path d="M 25,130 Q 65,100 100,100 T 175,130" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Globe / Meridians -->
  <ellipse cx="100" cy="100" rx="60" ry="60" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" opacity="0.8"/>
  <ellipse cx="100" cy="100" rx="30" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Center Crest / Mountain Symbol for Territory -->
  <polygon points="100,48 135,112 65,112" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="100,48 120,112 80,112" fill="url(#goldGrad)" opacity="0.15"/>
  <polygon points="100,48 100,112 65,112" fill="url(#emeraldGrad)" opacity="0.2"/>
  
  <!-- Academic Leaf / Ecology motif -->
  <path d="M 100,75 C 110,60 125,65 120,80 C 115,95 100,105 100,105 C 100,105 85,95 80,80 C 75,65 90,60 100,75 Z" fill="url(#emeraldGrad)" opacity="0.85"/>

  <!-- Center Text Badge: UR-GEDT -->
  <rect x="42" y="118" width="116" height="32" rx="6" fill="#0A1120" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="100" y="140" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="900" fill="#F7D070" text-anchor="middle" letter-spacing="1">UR-GEDT</text>
  
  <!-- Bottom Arc Text: UNILU -->
  <text x="100" y="172" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">UNIV. LUBUMBASHI</text>
  <!-- Top Arc Text: GEO-ECOLOGIE -->
  <text x="100" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">GEO-ECOLOGIE &amp; TERRITOIRES</text>
</svg>
